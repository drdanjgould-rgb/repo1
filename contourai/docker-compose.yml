services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: contourai
      POSTGRES_PASSWORD: contourai
      POSTGRES_DB: contourai
    ports:
      - "5432:5432"
    volumes:
      - contourai_pg:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contourai"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://contourai:contourai@db:5432/contourai
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./apps:/app/apps
      - ./tests:/app/tests

volumes:
  contourai_pg:
